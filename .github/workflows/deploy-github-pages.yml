name: Deploy Wahrly site to GitHub Pages

# Static landing + privacy/terms only — not the Expo app.
# Needed for App Store / Google OAuth privacy URLs.
# iPhone builds do not depend on this deploy.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-github-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble static site
        run: |
          mkdir -p pages
          # Canonical site at repo Pages root: /wahrly/
          cp -R site/. pages/
          # Also mirror under /nova/ with NO redirect.
          # Old bookmarks and cached "go to /nova/" index files must not loop.
          mkdir -p pages/nova
          cp -R site/. pages/nova/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
