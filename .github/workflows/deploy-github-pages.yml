name: Deploy Wahrly (NOVA) to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'nova/**'
      - '.github/workflows/deploy-github-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nova/package-lock.json

      - name: Build Wahrly web
        working-directory: nova
        env:
          EXPO_PUBLIC_API_URL: https://threeproxy-x9bi.onrender.com
          EXPO_PUBLIC_SUPABASE_URL: https://whvcsbxbizuychqclxcx.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndodmNzYnhiaXp1eWNocWNseGN4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY2NTc2NDUsImV4cCI6MjA5MjIzMzY0NX0.ZJ2qMGP3aNO5cC0VWKs-9pj2MFbkeJIQRTMxmdN3dK0
        run: |
          npm ci --legacy-peer-deps
          npx expo export --platform web
          # SPA fallback for Expo Router deep links on GitHub Pages
          cp dist/index.html dist/404.html

      - name: Assemble site
        run: |
          mkdir -p site/nova
          cp -R nova/dist/. site/nova/
          # Keep /3proxy/nova URL stable; root redirects to Wahrly.
          cat > site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8" />
          <meta http-equiv="refresh" content="0; url=nova/" />
          <title>Wahrly</title>
          <p><a href="nova/">Open Wahrly</a></p>
          HTML

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
