name: Deploy Wahrly site to GitHub Pages

# Static landing + privacy/terms only — not the Expo app.
# Needed for App Store / Google OAuth privacy URLs.
# iPhone builds do not depend on this deploy.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-github-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble static site
        run: |
          mkdir -p pages
          cp -R site/. pages/
          # Old /nova/ bookmarks → site root (survives 3proxy → wahrly rename)
          mkdir -p pages/nova
          cat > pages/nova/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8" />
          <meta http-equiv="refresh" content="0; url=../" />
          <link rel="canonical" href="../" />
          <title>Wahrly</title>
          <p><a href="../">Wahrly</a></p>
          HTML

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
