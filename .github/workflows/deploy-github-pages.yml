name: Deploy Wahrly privacy site to GitHub Pages

# Static landing + privacy only — not the Expo web app.
# Needed for App Store / Google OAuth privacy URLs.
# iPhone builds do not depend on this deploy.

on:
  push:
    branches: [main]
    paths:
      - 'nova/public-site/**'
      - '.github/workflows/deploy-github-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble static site
        run: |
          mkdir -p site/nova
          cp -R nova/public-site/. site/nova/
          # Repo root → /nova/
          cat > site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8" />
          <meta http-equiv="refresh" content="0; url=nova/" />
          <title>Wahrly</title>
          <p><a href="nova/">Wahrly</a></p>
          HTML

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
