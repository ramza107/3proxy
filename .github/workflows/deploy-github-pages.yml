name: Deploy Благовіст to GitHub Pages

on:
  push:
    branches: [main, cursor/church-app-ukrainian-d578]
    paths:
      - 'church-app/**'
      - '.github/workflows/deploy-github-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: church-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: church-app/package-lock.json
      - run: npm ci
      - name: Build for GitHub Pages
        env:
          GITHUB_PAGES: 'true'
          VITE_BASE: /3proxy/
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: church-app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
