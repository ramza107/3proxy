services:
  - type: web
    name: nova-ai
    runtime: node
    plan: free
    rootDir: nova/server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://threeproxy-x9bi.onrender.com/api/email/callback
      - key: PUBLIC_API_URL
        value: https://threeproxy-x9bi.onrender.com
      - key: PUBLIC_APP_URL
        value: https://ramza107.github.io/3proxy/nova/
