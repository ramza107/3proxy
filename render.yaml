services:
  - type: web
    name: nova-ai
    runtime: node
    plan: free
    # Repo restructure (#217): server lives under app/server (was nova/server).
    # If a deploy fails with "directory not found", set Root Directory to app/server
    # in the Render dashboard (Blueprint sync does not always rewrite it).
    rootDir: app/server
    # Match Dockerfile — omit devDeps to cut free-tier OOM / opaque build kills.
    # Fail loudly if Root Directory is still pointed at the old nova/server path.
    buildCommand: test -f package.json && test -f package-lock.json && npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.12.0"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://threeproxy-x9bi.onrender.com/api/google/callback
      - key: PUBLIC_API_URL
        value: https://threeproxy-x9bi.onrender.com
      - key: PUBLIC_APP_URL
        value: https://ramza107.github.io/wahrly/
      - key: PUBLIC_NATIVE_APP_URL
        value: wahrly://
