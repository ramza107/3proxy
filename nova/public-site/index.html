<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wahrly</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #0f2a32;
        --muted: #5a6f76;
        --accent: #0f6e66;
        --bg: #eef3f4;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
        background: linear-gradient(165deg, #e8eef0 0%, #f7fafb 55%, #e4ecec 100%);
        color: var(--ink);
        display: grid;
        place-items: center;
        padding: 32px 20px;
      }
      main {
        width: min(440px, 100%);
        background: rgba(255, 255, 255, 0.72);
        border: 1px solid rgba(15, 110, 102, 0.14);
        border-radius: 24px;
        padding: 28px 24px;
      }
      h1 {
        margin: 0 0 8px;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 40px;
        letter-spacing: -0.04em;
      }
      p { margin: 0 0 12px; color: var(--muted); line-height: 1.5; }
      a { color: var(--accent); font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <h1>Wahrly</h1>
      <p>Your life, clearly — on iPhone via the App Store / TestFlight.</p>
      <p>This page is only a public home + privacy / terms URLs for store and Google review. There is no web app here.</p>
      <p><a href="./privacy/">Privacy Policy</a> · <a href="./terms/">Terms of Use</a></p>
    </main>
  </body>
</html>
